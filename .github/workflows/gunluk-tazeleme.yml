name: Günlük tazeleme

# "Bu hafta sonu" ve "Etkinlikler" sayfaları DERLEME anındaki tarihe göre üretilir.
# Coolify manual webhook 200 dönüyor ama deploy tetiklemiyordu (nginx log ile doğrulandı:
# push'lara rağmen yeni container başlamadı). Bu yüzden Coolify deploy API'sini force=true
# ile doğrudan çağırıyoruz: kesin deploy + önbelleği atlar (derle.py taze tarihle çalışır).
# Elle de çalıştırılabilir (Actions → Run workflow).
#
# Secret'lar (Settings → Secrets and variables → Actions):
#   COOLIFY_DEPLOY_URL = https://coolify.polyazilim.com/api/v1/deploy?uuid=...  (eklendi)
#   COOLIFY_TOKEN      = Coolify API token (Keys & Tokens) — GEÇERLİ olmalı

on:
  schedule:
    - cron: "0 3 * * *"   # her gün 03:00 UTC = 06:00 TR
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Coolify deploy API'sini force=true ile çağır
        env:
          DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$TOKEN" ]; then
            echo "::error::COOLIFY_DEPLOY_URL ve/veya COOLIFY_TOKEN secret'ı eksik."
            exit 1
          fi
          case "$DEPLOY_URL" in
            *force=*) URL="$DEPLOY_URL" ;;
            *\?*)     URL="$DEPLOY_URL&force=true" ;;
            *)        URL="$DEPLOY_URL?force=true" ;;
          esac
          echo "POST (force=true)..."
          code=$(curl -sS -o /tmp/y.txt -w "%{http_code}" -X POST "$URL" -H "Authorization: Bearer $TOKEN")
          echo "HTTP $code"; cat /tmp/y.txt; echo ""
          case "$code" in
            2*) echo "Deploy tetiklendi ✓" ;;
            401) echo "::error::401 — token geçersiz/revoke. Coolify → Keys & Tokens'tan yeni token üretip COOLIFY_TOKEN secret'ını güncelle."; exit 1 ;;
            *)  echo "::error::Beklenmeyen yanıt (HTTP $code)"; exit 1 ;;
          esac
