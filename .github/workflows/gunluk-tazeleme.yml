name: Günlük tazeleme

# "Bu hafta sonu" ve "Etkinlikler" sayfaları DERLEME anındaki tarihe göre üretilir.
# Coolify'a bağlı GitHub webhook'u (repo Settings → Webhooks) her push'ta deploy tetikler.
# Bu iş her gün küçük bir zaman damgasını commit'ler:
#   - push → Coolify webhook → otomatik deploy
#   - data/ değiştiği için Docker `COPY data/` katmanı bozulur → derle.py taze tarihle çalışır
# Elle de çalıştırılabilir (Actions → Run workflow).

on:
  schedule:
    - cron: "0 3 * * *"   # her gün 03:00 UTC = 06:00 TR
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tazele:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zaman damgasını güncelle
        run: |
          BUGUN=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "$BUGUN" > data/derleme_zamani.txt
          echo "Yeni damga: $BUGUN"

      - name: Commit & push (Coolify webhook'unu tetikler)
        run: |
          git config user.name  "ankaradacocuk-bot"
          git config user.email "bot@ankaradacocuk.com"
          git add data/derleme_zamani.txt
          git commit -m "chore: günlük tazeleme $(date -u +'%Y-%m-%d')" || { echo "değişiklik yok"; exit 0; }
          git push
